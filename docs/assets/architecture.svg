<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">System1-Omni architecture</title>
  <desc id="desc">Three layers: a Rust frontend handles serving, System1-Omni model engines own execution, and CUDA and Metal backends provide GPU operations for NVIDIA and Apple GPUs. Requests flow downward and results return through the same boundary.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#65778e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #607087; }
      .heading { font-size: 27px; font-weight: 700; fill: #17283c; }
      .body { font-size: 18px; fill: #4b6078; }
      .small { font-size: 15px; fill: #607087; }
      .wire { fill: none; stroke: #65778e; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="1000" fill="#f5f7fb"/>
  <text x="64" y="76" font-size="38" font-weight="750" fill="#14253a">System1-Omni</text>
  <text x="64" y="111" font-size="19" fill="#607087">Shared serving. Model-owned execution. Hardware-specific kernels.</text>
  <rect x="947" y="49" width="189" height="35" rx="17.5" fill="#e7edf5"/>
  <text x="1041.5" y="72" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#536880">ARCHITECTURE BASELINE</text>

  <text x="64" y="163" class="label">01 / SERVING</text>
  <rect x="64" y="181" width="1072" height="149" rx="18" fill="#ffffff" stroke="#ccd9ec"/>
  <rect x="64" y="201" width="5" height="109" rx="2.5" fill="#5988d8"/>
  <text x="96" y="230" class="heading">Rust frontend</text>
  <text x="96" y="266" class="body">API · request lifecycle · response delivery</text>
  <text x="96" y="298" class="small">Serving concerns stay independent of model execution.</text>
  <path d="M580 340 V401" class="wire"/>
  <path d="M620 401 V340" class="wire"/>
  <text x="647" y="366" font-size="15" font-weight="600" fill="#4b6078">Small engine interface</text>
  <text x="647" y="390" class="small">Requests in · results out</text>

  <text x="64" y="423" class="label">02 / MODEL-OWNED EXECUTION</text>
  <rect x="64" y="441" width="1072" height="208" rx="18" fill="#ffffff" stroke="#badbd4"/>
  <rect x="64" y="461" width="5" height="168" rx="2.5" fill="#36a58e"/>
  <text x="96" y="490" class="heading">System1-Omni models</text>
  <text x="96" y="524" class="small">Each model owns its complete execution path.</text>
  <rect x="96" y="550" width="294" height="64" rx="11" fill="#edf7f4"/>
  <rect x="406" y="550" width="294" height="64" rx="11" fill="#edf7f4"/>
  <rect x="716" y="550" width="388" height="64" rx="11" fill="#edf7f4"/>
  <text x="243" y="589" text-anchor="middle" font-size="18" font-weight="600" fill="#296957">Pre / postprocessing</text>
  <text x="553" y="589" text-anchor="middle" font-size="18" font-weight="600" fill="#296957">Batching · state</text>
  <text x="910" y="589" text-anchor="middle" font-size="18" font-weight="600" fill="#296957">Execution · kernel selection</text>

  <path d="M600 649 V678 H325 V731" class="wire"/>
  <path d="M600 678 H875 V731" class="wire"/>
  <text x="64" y="714" class="label">03 / GPU BACKENDS</text>
  <rect x="64" y="744" width="522" height="168" rx="18" fill="#ffffff" stroke="#d7cdeb"/>
  <rect x="614" y="744" width="522" height="168" rx="18" fill="#ffffff" stroke="#d7cdeb"/>
  <rect x="64" y="764" width="5" height="128" rx="2.5" fill="#9272c8"/>
  <rect x="614" y="764" width="5" height="128" rx="2.5" fill="#9272c8"/>
  <text x="96" y="794" class="heading">CUDA backend</text>
  <text x="96" y="830" class="body">High-performance GPU kernels</text>
  <text x="96" y="875" font-size="16" font-weight="600" fill="#79609f">NVIDIA GPUs</text>
  <text x="646" y="794" class="heading">Metal backend</text>
  <text x="646" y="830" class="body">High-performance GPU kernels</text>
  <text x="646" y="875" font-size="16" font-weight="600" fill="#79609f">Apple GPUs</text>
  <text x="64" y="957" class="small">Minimal shared utilities · model-owned policy · backend-specific optimization</text>
</svg>
