name: 🐛 Bug report
description: Raise an issue here if you find a bug.
title: "[Bug]: "
labels: ["bug"]

body:
- type: markdown
  attributes:
    value: >
      #### Before submitting an issue, please make sure the issue hasn't been already addressed by searching through [the existing and past issues](https://github.com/ThinkFlowLab/system1-omni/issues?q=is%3Aissue+sort%3Acreated-desc+).
- type: markdown
  attributes:
    value: |
      ⚠️ **SECURITY WARNING:** Please review any text you paste to ensure it does not contain sensitive information such as:
      - API tokens or keys (e.g., Hugging Face tokens, OpenAI API keys)
      - Passwords or authentication credentials
      - Private URLs or endpoints
      - Personal or confidential data

      Consider redacting or replacing sensitive values with placeholders like `<YOUR_TOKEN_HERE>` when sharing configuration or code examples.
- type: textarea
  id: current-environment
  attributes:
    label: Your current environment
    description: |
      Please include your operating system and version, CPU, GPU model and memory,
      intended backend (CUDA or Metal), and relevant toolchain/dependency versions.
      Include the repository commit (`git rev-parse HEAD` from your clone).
      For CUDA, include the driver and CUDA versions (for example, from `nvidia-smi`).
      For Metal, include your Mac chip and macOS version.
    value: |
      <details>
      <summary>Environment info</summary>

      ```text
      Your environment details
      ```

      </details>
  validations:
    required: true

- type: textarea
  id: code-version
  attributes:
    label: Your code version
    description: |
      Please provide a description of which commit id or version of System1-Omni the code is.
      If you are using an implementation branch, include its name and any relevant
      dependency versions. The main branch is currently in the design stage.
    value: |
      <details>
      <summary>The commit id or version of System1-Omni</summary>

      ```text
      git rev-parse HEAD  # from your clone
      ```

      </details>
  validations:
    required: true

- type: textarea
  id: bug-description
  attributes:
    label: 🐛 Describe the bug
    description: |
      Please provide a clear and concise description of what the bug is.

      Include minimal reproduction steps or a self-contained code example, along with
      the model, backend (CUDA or Metal), inputs, and command you used, if applicable.
      For design or documentation bugs, link to the affected section and explain the
      inconsistency. No model engines or GPU backends are implemented on main yet.

      If the code is too long (hopefully, it isn't), feel free to put it in a public gist and link it in the issue: https://gist.github.com.

      Please also paste or describe the results you observe instead of the expected results. If you observe an error, please paste the error message including the **full** traceback of the exception. It may be relevant to wrap error messages in a fenced code block (triple backticks).
    placeholder: |
      A clear and concise description of what the bug is.

      ```python
      # Sample code to reproduce the problem
      ```

      ```
      The error message you got, with the full traceback and the error logs if present.
      ```
  validations:
    required: true
- type: markdown
  attributes:
    value: |
      If you are reporting a model output discrepancy from an implementation branch,
      include a comparison with the model's reference implementation when available.
      Link to the reference implementation and provide the inputs, scripts, observed
      results, and expected results for both.

      Thanks for reporting 🙏!
- type: checkboxes
  id: precheck
  attributes:
    label: Before submitting a new issue...
    options:
      - label: Make sure you already searched for relevant issues in the [issue tracker](https://github.com/ThinkFlowLab/system1-omni/issues?q=is%3Aissue+sort%3Acreated-desc+), and looked for the answer in the [documentation](https://github.com/ThinkFlowLab/system1-omni#readme).
        required: true
