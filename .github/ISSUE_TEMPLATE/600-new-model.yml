name: 🤗 Support request for a new model
description: Submit a proposal/request for a new model support
title: "[New Model]: "
labels: ["new model"]

body:
- type: markdown
  attributes:
    value: >
      #### Before submitting an issue, please make sure the issue hasn't been already addressed by searching through [the existing and past issues](https://github.com/ThinkFlowLab/system1-omni/issues?q=is%3Aissue+sort%3Acreated-desc+).

      #### System1-Omni is in the design stage, with **LAYA** as the first planned model and no models implemented yet. See the [architecture](https://github.com/ThinkFlowLab/system1-omni#architecture) and [model status](https://github.com/ThinkFlowLab/system1-omni#supported-models).
- type: textarea
  attributes:
    label: The model to consider.
    description: >
      A link to the model weights, paper, or reference implementation.
  validations:
    required: true
- type: textarea
  attributes:
    label: The closest planned or implemented model.
    description: >
      Is the model similar to LAYA or another proposed model? If none is similar, describe its execution requirements.
- type: textarea
  attributes:
    label: What's your difficulty of supporting the model you want?
    description: >
      For example, does it need new operators, preprocessing or postprocessing, batching, or execution state? Describe its prefill-only execution path and any CUDA or Metal requirements.
- type: textarea
  attributes:
    label: Use case and motivation
    description: >
      What is the primary use case for this model? Why is it important to support in System1-Omni?
- type: markdown
  attributes:
    value: >
      Thanks for contributing 🎉!
- type: checkboxes
  id: precheck
  attributes:
    label: Before submitting a new issue...
    options:
      - label: Make sure you already searched for relevant issues in the [issue tracker](https://github.com/ThinkFlowLab/system1-omni/issues?q=is%3Aissue+sort%3Acreated-desc+), and looked for the answer in the [documentation](https://github.com/ThinkFlowLab/system1-omni#readme).
        required: true
