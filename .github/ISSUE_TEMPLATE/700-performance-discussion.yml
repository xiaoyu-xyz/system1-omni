name: ⚡ Discussion on the performance of System1-Omni
description: Submit a proposal/discussion about the performance of System1-Omni
title: "[Performance]: "
labels: ["performance"]

body:
- type: markdown
  attributes:
    value: >
      #### Before submitting an issue, please make sure the issue hasn't been already addressed by searching through [the existing and past issues](https://github.com/ThinkFlowLab/system1-omni/issues?q=is%3Aissue+sort%3Acreated-desc+).
- type: textarea
  attributes:
    label: Proposal to improve performance
    description: >
      How do you plan to improve System1-Omni's performance?
  validations:
    required: false
- type: textarea
  attributes:
    label: Report of performance regression
    description: >
      No benchmark suite is available on main yet. For an implementation branch, provide the compared commits, model, backend, hardware, inputs, exact commands, warmup procedure, and repeated measurements. Keep these settings fixed across comparisons and include raw results and variability.
  validations:
    required: false
- type: textarea
  attributes:
    label: Misc discussion on performance
    description: >
      Anything about the performance.
  validations:
    required: false
- type: textarea
  attributes:
    label: Your current environment (if you think it is necessary)
    description: |
      Please include your operating system and version, CPU, GPU model and memory,
      intended backend (CUDA or Metal), and relevant toolchain/dependency versions.
      Include the repository commit (`git rev-parse HEAD` from your clone).
      For CUDA, include the driver and CUDA versions (for example, from `nvidia-smi`).
      For Metal, include your Mac chip and macOS version.
    value: |
      ```text
      Your environment details
      ```
  validations:
    required: false
- type: markdown
  attributes:
    value: >
      Thanks for contributing 🎉!
- type: checkboxes
  id: precheck
  attributes:
    label: Before submitting a new issue...
    options:
      - label: Make sure you already searched for relevant issues in the [issue tracker](https://github.com/ThinkFlowLab/system1-omni/issues?q=is%3Aissue+sort%3Acreated-desc+), and looked for the answer in the [documentation](https://github.com/ThinkFlowLab/system1-omni#readme).
        required: true
